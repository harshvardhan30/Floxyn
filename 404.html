<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Auto Solution</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script>(function(){var t=null;try{t=localStorage.getItem('as-theme')}catch(e){}if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<style>
.nf{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 6vw;position:relative;z-index:2}
.nf-code{font-family:var(--font-mono);font-size:14px;color:var(--accent);margin-bottom:12px}
.nf h1{font-family:var(--font-display);font-size:clamp(28px,5vw,44px);letter-spacing:-1px;margin-bottom:12px}
.nf p{color:var(--muted);max-width:440px;margin:0 auto 28px}
.nf .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<main class="nf">
  <div>
    <p class="nf-code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be old or mistyped. Head back to the homepage, or tell us what you were looking for.</p>
    <div class="row">
      <a class="btn btn-grad" href="/">Go to homepage</a>
      <a class="btn btn-secondary" href="/#contact">Contact us</a>
    </div>
  </div>
</main>
</body>
</html>
