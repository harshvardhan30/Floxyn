<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Auto Solution</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.nf{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 6vw;position:relative;z-index:2}
.nf-code{font-family:var(--mono);font-size:14px;color:var(--signal);margin-bottom:12px}
.nf h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,5vw,44px);letter-spacing:-1px;margin-bottom:12px}
.nf p{color:var(--muted);max-width:440px;margin:0 auto 28px}
.nf .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<main class="nf">
  <div>
    <p class="nf-code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be old or mistyped. Head back to the homepage, or tell us what you were looking for.</p>
    <div class="row">
      <a class="btn btn-primary" href="/">Go to homepage</a>
      <a class="btn btn-ghost" href="/#contact">Contact us</a>
    </div>
  </div>
</main>
</body>
</html>
